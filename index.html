<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Walkman</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #000; }
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between;
         padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; font: bold 16px monospace; color: #ff0; background: rgba(0,0,0,.75); }
  #msg { position: fixed; inset: 0; z-index: 1001; display: flex; align-items: center; justify-content: center;
         flex-direction: column; font: bold 28px monospace; color: #ff0; background: rgba(0,0,0,.8); text-align: center; }
  #msg button { margin-top: 20px; font: bold 20px monospace; padding: 12px 24px; background: #ff0; border: 0; }
  #pad { position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 1000;
         display: grid; grid-template-columns: repeat(3, 52px); gap: 4px; }
  #pad[hidden] { display: none; }
  #pad button { height: 52px; font: bold 22px monospace; color: #ff0; background: rgba(0,0,0,.7); border: 2px solid #ff0;
                border-radius: 8px; touch-action: manipulation; }
  #pad button:active { background: #ff0; color: #000; }
  #gps { position: fixed; left: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 1000;
         font: 12px monospace; color: #ff0; background: rgba(0,0,0,.7); padding: 6px 8px; }
  #flight { position: fixed; left: 16px; right: 16px; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 1000;
            padding: 12px; text-align: center; font: bold 18px monospace; color: #000; background: #0ff; }
  #flight[hidden] { display: none; }
  .pac { width: 28px; height: 28px; position: relative; }
  .pac i { position: absolute; left: 0; width: 28px; height: 14px; background: #ff0; }
  .pac i:first-child { top: 0; border-radius: 14px 14px 0 0; transform-origin: 50% 100%; animation: jaw-top .25s infinite alternate; }
  .pac i:last-child { bottom: 0; border-radius: 0 0 14px 14px; transform-origin: 50% 0; animation: jaw-bot .25s infinite alternate; }
  @keyframes jaw-top { to { transform: rotate(-35deg); } }
  @keyframes jaw-bot { to { transform: rotate(35deg); } }
  @media (prefers-reduced-motion: reduce) { .pac i { animation: none !important; } }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(.7); }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><span id="score">SCORE 0</span><span id="dist">0 m</span><span id="lives">♥♥♥</span></div>
<div id="msg">WALKMAN<br><small style="font-size:14px">Walk the streets to eat dots. Avoid ghosts.<br>No GPS? Use the arrows.</small><button id="start">START</button></div>
<div id="pad" hidden><span></span><button data-d="0,5">▲</button><span></span><button data-d="-5,0">◀</button><span></span><button data-d="5,0">▶</button><span></span><button data-d="0,-5">▼</button><span></span></div>
<div id="gps">GPS: waiting</div>
<div id="flight" hidden>✈ FLIGHT MODE — PAUSED<br><small id="flight-speed"></small></div>
<script>
const DOT_SPACING = 25, FIELD_RADIUS = 200, EAT_RADIUS = 12, CATCH_RADIUS = 10;
const GHOST_SPEED = 0.9, POWER_MS = 30000; // m/s, slower than walking (~1.4)
const FLIGHT_KMH = 5, RESUME_KMH = 4.5, SPEED_WINDOW_MS = 10000; // above FLIGHT_KMH you're not walking
const GHOST_COLORS = ['#f00', '#fbb', '#0ff', '#fa0'];

const map = L.map('map', { zoomControl: false }).setView([60.17, 24.94], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' }).addTo(map);

let player, pos, dots = [], ghosts = [], score = 0, lives = 3, walked = 0, powerUntil = 0, started = false, sim = false, over = false;
const $ = id => document.getElementById(id);

// meters <-> latlng offsets
const offset = (ll, dx, dy) => L.latLng(ll.lat + dy / 111320, ll.lng + dx / (111320 * Math.cos(ll.lat * Math.PI / 180)));
const dist = (a, b) => map.distance(a, b);

// Walkable roads from OpenStreetMap, sampled into dots every DOT_SPACING m
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function roadChains(origin) {
  const q = `[out:json][timeout:15];way["highway"~"^(footway|path|pedestrian|residential|living_street|service|unclassified|tertiary|secondary|primary|cycleway|steps|track)$"](around:${FIELD_RADIUS},${origin.lat},${origin.lng});out geom;`;
  let data;
  for (const url of OVERPASS) {
    try {
      const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), signal: AbortSignal.timeout(12000) });
      if (res.ok) { data = await res.json(); break; }
    } catch (e) {}
  }
  if (!data) throw new Error('no overpass server');
  // Each way becomes a chain of points every DOT_SPACING m, plus its end vertex
  return data.elements.map(way => {
    const g = way.geometry.map(v => toXY(L.latLng(v.lat, v.lon))), chain = [];
    let carry = 0;
    for (let i = 1; i < g.length; i++) {
      const [x0, y0] = g[i - 1], [x1, y1] = g[i], len = Math.hypot(x1 - x0, y1 - y0);
      for (let t = carry; t < len; t += DOT_SPACING) chain.push([x0 + (x1 - x0) * t / len, y0 + (y1 - y0) * t / len]);
      carry = (carry - len) % DOT_SPACING; if (carry < 0) carry += DOT_SPACING;
    }
    chain.push(g[g.length - 1]);
    return chain;
  });
}

function gridChains() {
  const chains = [];
  for (let x = -FIELD_RADIUS; x <= FIELD_RADIUS; x += DOT_SPACING)
    for (let y = -FIELD_RADIUS; y <= FIELD_RADIUS; y += DOT_SPACING) chains.push([[x, y]]);
  return chains;
}

// Road graph: nodes = dots. Edges link consecutive points on a road, plus
// nodes closer than `prox` (joins roads where they cross or meet).
function buildGraph(chains, prox) {
  const nodes = [], adj = [];
  const link = (a, b) => { if (a !== b) { adj[a].add(b); adj[b].add(a); } };
  const nodeFor = p => {
    if (Math.hypot(...p) > FIELD_RADIUS) return -1;
    const near = nodes.findIndex(n => Math.hypot(n[0] - p[0], n[1] - p[1]) < DOT_SPACING * 0.6);
    if (near >= 0) return near;
    nodes.push(p); adj.push(new Set());
    return nodes.length - 1;
  };
  for (const chain of chains) {
    let prev = -1;
    for (const p of chain) { const i = nodeFor(p); if (i >= 0 && prev >= 0) link(i, prev); prev = i; }
  }
  for (let a = 0; a < nodes.length; a++)
    for (let b = a + 1; b < nodes.length; b++)
      if (Math.hypot(nodes[a][0] - nodes[b][0], nodes[a][1] - nodes[b][1]) < prox) link(a, b);
  return { nodes, adj: adj.map(s => [...s]) };
}

// Hops from `from` to every node (Infinity = unreachable)
function bfs(from) {
  const d = new Array(graph.nodes.length).fill(Infinity), queue = [from];
  d[from] = 0;
  for (let i = 0; i < queue.length; i++)
    for (const n of graph.adj[queue[i]]) if (d[n] === Infinity) { d[n] = d[queue[i]] + 1; queue.push(n); }
  return d;
}
const nearestNode = xy => graph.nodes.reduce((best, n, i) =>
  Math.hypot(n[0] - xy[0], n[1] - xy[1]) < Math.hypot(graph.nodes[best][0] - xy[0], graph.nodes[best][1] - xy[1]) ? i : best, 0);

let loading = false, origin, graph, headingFrom;
const toXY = ll => [(ll.lng - origin.lng) * 111320 * Math.cos(origin.lat * Math.PI / 180), (ll.lat - origin.lat) * 111320];
async function setup(o) {
  if (loading) return;
  loading = true;
  origin = o;
  map.setView(origin, 18);
  $('gps').textContent = 'Loading roads…';
  try {
    graph = buildGraph(await roadChains(origin), DOT_SPACING * 0.7);
    if (graph.nodes.length < 10) throw new Error('too few roads');
    $('gps').textContent = graph.nodes.length + ' dots on roads';
  } catch (e) {
    graph = buildGraph(gridChains(), DOT_SPACING * 1.05);
    $('gps').textContent = 'Roads failed, grid mode';
  }
  const pts = graph.nodes;
  // Power pellet = farthest dot in each quadrant
  const power = new Set([0, 1, 2, 3].map(qd => pts.reduce((best, p, i) =>
    (p[0] >= 0) === !!(qd & 1) && (p[1] >= 0) === !!(qd & 2) && (best < 0 || Math.hypot(...p) > Math.hypot(...pts[best])) ? i : best, -1)));
  pts.forEach((p, i) => {
    if (Math.hypot(...p) < EAT_RADIUS) return;
    const ll = offset(origin, ...p), pw = power.has(i);
    dots.push({ ll, power: pw, m: L.circleMarker(ll, { radius: pw ? 8 : 4, weight: 0, fillOpacity: 1, fillColor: '#fcb' }).addTo(map) });
  });
  // Ghosts start on road nodes near the field's diagonals, in the player's network
  const reach = bfs(nearestNode([0, 0]));
  GHOST_COLORS.forEach((c, i) => {
    const a = i * Math.PI / 2 + Math.PI / 4, spot = [Math.cos(a) * FIELD_RADIUS * 0.9, Math.sin(a) * FIELD_RADIUS * 0.9];
    const home = pts.reduce((best, n, j) => reach[j] < Infinity && (best < 0 ||
      Math.hypot(n[0] - spot[0], n[1] - spot[1]) < Math.hypot(pts[best][0] - spot[0], pts[best][1] - spot[1])) ? j : best, -1);
    const g = { home, color: c, m: L.circleMarker(offset(origin, ...pts[home]), { radius: 9, color: c, fillColor: c, fillOpacity: 1 }).addTo(map) };
    sendHome(g);
    ghosts.push(g);
  });
  player = L.marker(origin, { interactive: false, zIndexOffset: 1000,
    icon: L.divIcon({ className: '', iconSize: [28, 28], html: '<div class="pac"><i></i><i></i></div>' }) }).addTo(map);
  pos = origin;
  started = true;
  setInterval(tick, 1000);
}
function sendHome(g) { g.at = g.home; g.to = -1; g.xy = [...graph.nodes[g.home]]; }

function moveTo(ll) {
  if (over) return;
  if (!started) return setup(ll);
  if (flying) { pos = ll; headingFrom = null; player.setLatLng(ll); map.panTo(ll); return; }
  walked += dist(pos, ll);
  // Face the direction of travel (0deg = east); ignore GPS jitter under 3 m
  const [x0, y0] = headingFrom ||= toXY(pos), [x1, y1] = toXY(ll);
  if (Math.hypot(x1 - x0, y1 - y0) >= 3) {
    player.getElement().firstChild.style.transform = `rotate(${Math.atan2(-(y1 - y0), x1 - x0)}rad)`;
    headingFrom = [x1, y1];
  }
  pos = ll;
  player.setLatLng(ll);
  map.panTo(ll, { animate: true });
  dots = dots.filter(d => {
    if (dist(d.ll, pos) > EAT_RADIUS) return true;
    map.removeLayer(d.m);
    score += d.power ? 50 : 10;
    buzz(d.power ? [80, 60, 80] : 25);
    d.power ? tone(300, 900, 0.3) : waka();
    if (d.power) powerUntil = Date.now() + POWER_MS;
    return false;
  });
  if (!dots.length) end('YOU WIN!');
  hud();
}

// Ghosts walk the road graph: at each node pick the neighbor closest to the
// player (or farthest when scared). On the player's node they step straight at them.
function tick() {
  if (over || flying) return;
  const scared = Date.now() < powerUntil, me = toXY(pos), meNode = nearestNode(me), hops = bfs(meNode);
  const stepTo = (g, target, budget) => {
    const d = Math.hypot(target[0] - g.xy[0], target[1] - g.xy[1]);
    if (d <= budget) { g.xy = [...target]; return budget - d; }
    g.xy = [g.xy[0] + (target[0] - g.xy[0]) * budget / d, g.xy[1] + (target[1] - g.xy[1]) * budget / d];
    return 0;
  };
  ghosts.forEach(g => {
    if (over) return;
    let budget = GHOST_SPEED * (scared ? 0.5 : 1);
    for (let guard = 0; budget > 0 && guard < 10; guard++) {
      if (g.to < 0) {
        if (!scared && g.at === meNode) { stepTo(g, me, budget); break; }
        const nb = graph.adj[g.at];
        if (!nb.length) break;
        const rank = n => hops[n] === Infinity ? Math.random() * 1e6 : hops[n] + Math.random() * 0.5;
        g.to = nb.reduce((best, n) => (scared ? rank(n) > rank(best) : rank(n) < rank(best)) ? n : best);
      }
      budget = stepTo(g, graph.nodes[g.to], budget);
      if (budget > 0 || Math.hypot(...graph.nodes[g.to].map((v, k) => v - g.xy[k])) < 0.01) { g.at = g.to; g.to = -1; }
    }
    const c = scared ? '#22f' : g.color;
    g.m.setLatLng(offset(origin, ...g.xy)).setStyle({ color: c, fillColor: c });
    if (Math.hypot(g.xy[0] - me[0], g.xy[1] - me[1]) < CATCH_RADIUS) {
      if (scared) { score += 200; sendHome(g); }
      else if (--lives <= 0) return end('GAME OVER');
      else ghosts.forEach(sendHome);
      buzz(300);
      if (!scared) tone(700, 100, 0.8);
    }
  });
  hud();
}

// Haptics: Vibration API (Android). iOS Safari lacks it, but toggling a
// native switch control (iOS 18+) plays a system haptic tick.
const iosSwitch = Object.assign(document.createElement('input'), { type: 'checkbox' });
iosSwitch.setAttribute('switch', '');
const iosLabel = document.createElement('label');
iosLabel.append(iosSwitch);
iosLabel.style.cssText = 'position:fixed;opacity:0;pointer-events:none;left:0;top:0';
document.body.append(iosLabel);
function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
  else iosLabel.click();
}

// Sound: synthesized with Web Audio, unlocked by the START tap
let audio, wakaFlip = false;
function tone(from, to, secs) {
  if (!audio) return;
  const t = audio.currentTime, osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(from, t);
  osc.frequency.linearRampToValueAtTime(to, t + secs);
  gain.gain.setValueAtTime(0.3, t);
  gain.gain.linearRampToValueAtTime(0, t + secs);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + secs);
}
// Alternate "wa" (falling) and "ka" (rising) like the arcade chomp
function waka() { (wakaFlip = !wakaFlip) ? tone(500, 250, 0.12) : tone(250, 500, 0.12); }

// Speed = distance over the last SPEED_WINDOW_MS of GPS fixes. Too fast = flight mode (paused).
let fixes = [], flying = false;
function trackSpeed(ll, t) {
  fixes.push({ ll, t });
  while (fixes.length > 2 && t - fixes[1].t >= SPEED_WINDOW_MS) fixes.shift();
  const dt = (t - fixes[0].t) / 1000;
  const kmh = dt >= 3 ? dist(fixes[0].ll, ll) / dt * 3.6 : 0;
  if (!flying && kmh > FLIGHT_KMH) flying = true;
  else if (flying && kmh < RESUME_KMH) flying = false;
  $('flight').hidden = !flying;
  $('flight-speed').textContent = kmh.toFixed(1) + ' km/h · slow to walking pace to resume';
  return kmh;
}

function hud() {
  $('score').textContent = 'SCORE ' + score;
  $('dist').textContent = Math.round(walked) + ' m' + (Date.now() < powerUntil ? ' ⚡' : '');
  $('lives').textContent = '♥'.repeat(Math.max(lives, 0));
}

function end(text) {
  over = true;
  $('msg').innerHTML = `${text}<br>SCORE ${score}<br>${Math.round(walked)} m walked<button onclick="location.reload()">AGAIN</button>`;
  $('msg').style.display = 'flex';
}

$('start').onclick = () => {
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  $('msg').style.display = 'none';
  const lock = () => navigator.wakeLock?.request('screen').catch(() => {});
  lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock());
  if (!navigator.geolocation) return startSim();
  navigator.geolocation.watchPosition(
    p => {
      if (sim || (started && p.coords.accuracy >= 50)) return;
      const ll = L.latLng(p.coords.latitude, p.coords.longitude);
      if (started) {
        const kmh = trackSpeed(ll, p.timestamp);
        $('gps').textContent = 'GPS ±' + Math.round(p.coords.accuracy) + ' m · ' + kmh.toFixed(1) + ' km/h';
      }
      moveTo(ll);
    },
    e => { $('gps').textContent = 'GPS off: ' + e.message; startSim(); }, { enableHighAccuracy: true, maximumAge: 0 });
};
function startSim() { $('pad').hidden = false; if (!started) { sim = true; moveTo(map.getCenter()); } }

// Simulate walking: on-screen pad or arrow keys (5 m per press)
document.querySelectorAll('#pad button').forEach(b => b.onclick = () => {
  if (!pos) return;
  sim = true;
  moveTo(offset(pos, ...b.dataset.d.split(',').map(Number)));
});
addEventListener('keydown', e => {
  const k = { ArrowUp: [0, 5], ArrowDown: [0, -5], ArrowLeft: [-5, 0], ArrowRight: [5, 0] }[e.key];
  if (!k || !pos) return;
  sim = true;
  moveTo(offset(pos, ...k));
});
</script>
</body>
</html>
